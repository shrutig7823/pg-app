<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Find a PG</title>
  </head>
  <body>
    <h1>Find the nearest PG in Bangalore</h1>
    <p>Search PGs near your office.</p>
    <label>Where do you work?</label>
    <input type="text" placeholder="For example: HSR Layout">

    <label>Maximum rent per month</label>
    <input type="number" id="maxRent" placeholder="15000">

    <button id="findBtn">Find PGs</button>
    <div id="results"></div>

    <script>
      const pgs = [
        { name: "Sunrise PG (sample)", rent: 9500, area: "HSR Layout" },
        { name: "Ollie PG (sample)", rent: 12000, area: "Koramangala" },
        { name: "Feb PG (sample)", rent: 8000, area: "BTM Layout" },
        { name: "March (sample)", rent: 6000, area: "Green glenn Layout" }
      ];

      function showPgs(list) {
        const results = document.getElementById("results");
        if (list.length === 0) {
          results.innerHTML = "<p>No PGs found. Try a higher rent.</p>";
          return;
        }
        results.innerHTML = list.map(function (pg) {
          return "<div><h3>" + pg.name + "</h3><p>Rent: ₹" + pg.rent + " per month</p><p>" + pg.area + "</p></div>";
        }).join("");
      }

      showPgs(pgs);

      document.getElementById("findBtn").onclick = function () {
        const maxRent = Number(document.getElementById("maxRent").value);
        if (!maxRent) {
          showPgs(pgs);
          return;
        }
        const matches = pgs.filter(function (pg) {
          return pg.rent <= maxRent;
        });
        showPgs(matches);
      };
    </script>
  </body>
</html>
